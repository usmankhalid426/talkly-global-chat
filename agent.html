<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Talkly Growth Agent</title><style>
body{margin:0;background:#07111f;color:#eef4fb;font:15px Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.card{background:#0d1a2b;border:1px solid #203149;border-radius:18px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{font-size:28px;font-weight:700}.muted{color:#91a1b7}.btn{background:#4f8cff;color:#fff;border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.idea{border-top:1px solid #203149;padding:16px 0}.idea:first-child{border-top:0}.tag{display:inline-block;background:#142a48;color:#9fc1ff;border-radius:8px;padding:5px 8px;font-size:12px;margin:4px 5px 4px 0}.draft{background:#091728;border:1px solid #263a55;border-radius:12px;padding:14px;margin-top:10px}.draft textarea{width:100%;min-height:220px;background:#07111f;color:#eef4fb;border:1px solid #263a55;border-radius:8px;padding:10px;box-sizing:border-box}.hidden{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="top"><div><h1>Talkly Growth Agent</h1><div class="muted">Research → ideas → human-approved content → real traffic</div></div><button class="btn" onclick="runAgent()">Run AI Growth Agent</button></div>
<div class="card"><div class="muted">Admin key</div><input id="key" type="password" placeholder="Enter AGENT_ADMIN_KEY" style="width:100%;box-sizing:border-box;margin-top:8px;padding:11px;background:#07111f;color:white;border:1px solid #263a55;border-radius:8px"></div>
<div id="stats" class="grid"></div><div class="card"><h2>Content opportunities</h2><div id="ideas" class="muted">Run the agent to discover opportunities.</div></div><div id="msg" class="muted"></div></div>
<script>
const key=()=>document.getElementById('key').value;
async function api(url,opt={}){opt.headers=Object.assign({'x-agent-key':key(),'Content-Type':'application/json'},opt.headers||{});const r=await fetch(url,opt);const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function load(){try{const d=await api('/api/agent/dashboard');document.getElementById('stats').innerHTML=[['Users',d.stats.users],['Matches',d.stats.matches],['Messages',d.stats.messages],['New users 7d',d.stats.new_users_7d],['Matches 7d',d.stats.matches_7d],['Messages 7d',d.stats.messages_7d]].map(x=>'<div class="card"><div class="muted">'+x[0]+'</div><div class="stat">'+x[1]+'</div></div>').join('');document.getElementById('ideas').innerHTML=d.ideas.length?d.ideas.map(x=>'<div class="idea"><h3>'+esc(x.title)+'</h3><span class="tag">'+esc(x.keyword||'')+'</span><span class="tag">'+esc(x.intent||'')+'</span><p class="muted">'+esc(x.rationale||'')+'</p><button class="btn" onclick="draft('+x.id+')">Generate draft</button><div id="draft-'+x.id+'"></div></div>').join(''):'No ideas yet.'}catch(e){document.getElementById('msg').textContent=e.message}}
async function runAgent(){document.getElementById('msg').textContent='Agent is researching current demand…';try{const d=await api('/api/agent/run',{method:'POST'});document.getElementById('msg').textContent='Done: '+d.ideasFound+' opportunities found.';load()}catch(e){document.getElementById('msg').textContent=e.message}}
async function draft(id){const box=document.getElementById('draft-'+id);box.innerHTML='<p class="muted">Generating…</p>';try{const d=await api('/api/agent/draft',{method:'POST',body:JSON.stringify({ideaId:id})});box.innerHTML='<div class="draft"><strong>'+esc(d.title)+'</strong><p class="muted">'+esc(d.description)+'</p><textarea>'+d.body.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</textarea><p class="muted">Saved as a draft. Publish only after human review.</p></div>'}catch(e){box.innerHTML='<p class="muted">'+esc(e.message)+'</p>'}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
</script></body></html>
